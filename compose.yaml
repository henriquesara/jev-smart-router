services:
  jev-router:
    build: .
    container_name: jev-router
    restart: unless-stopped

    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4100:4100"

    # Somente os dois arquivos que o router lê, em modo somente leitura.
    # Backups e outros arquivos locais de config/ não entram no container.
    volumes:
      - ./config/config.json:/config/config.json:ro
      - ./config/env:/config/env:ro
      # Router Settings do Live View: presets do request downgrade em router-settings.json
      # (sem segredos, ignorado pelo Git). Única montagem gravável vinda do host.
      - ./config/runtime:/config/runtime
      - jev-router-state:/state

    environment:
      JEV_ROUTER_SETTINGS_FILE: /config/runtime/router-settings.json

    security_opt:
      - no-new-privileges:true

  model-watcher:
    # O watcher só precisa de Node e de fetch nativo; não usa a imagem do router.
    image: node:22-bookworm-slim
    container_name: jev-model-watcher
    restart: unless-stopped

    # Sem acesso a config/env: o watcher nunca vê credenciais.
    volumes:
      - ./config/config.json:/config/config.json:ro
      - ./model-lab:/model-lab

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    command:
      - node
      - /model-lab/docker-watcher.mjs

volumes:
  jev-router-state:
